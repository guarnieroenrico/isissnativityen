<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sala di attesa · ISISS</title>
<style>
:root{--navy:#0a1f17;--ink:#fff8ec;--muted:#cfe0d2;--orange:#f2c14e;--pink:#d62839;--teal:#c9a227;--green:#1f8a4c;--red:#d62839;--gold:#f2c14e;--pine:#0f2e21}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0%,#17402e 0%,#0a1f17 60%,#06130e 100%) fixed,var(--navy);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.panel{width:min(720px,100%);display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:28px;align-items:center;padding:72px 28px 28px;border-radius:28px;position:relative;background:linear-gradient(160deg,#143826,#0f2e21 60%,#0c261b);border:2px solid rgba(242,193,78,.55);box-shadow:0 0 0 6px rgba(214,40,57,.18),0 24px 70px rgba(0,0,0,.55),0 0 60px rgba(242,193,78,.12)}
.kick{margin:0 0 6px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--gold)}
.panel img{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 22px rgba(0,0,0,.5))}
h1{margin:0 0 10px;font-family:Georgia,"Times New Roman",serif;font-size:clamp(26px,5vw,40px);line-height:1.1;color:#fff8ec;text-shadow:0 2px 0 rgba(214,40,57,.6),0 0 18px rgba(242,193,78,.35)}
p{margin:0 0 18px;color:var(--muted);line-height:1.55;max-width:46ch}
button{border:0;border-radius:16px;padding:15px 22px;font-size:17px;font-weight:800;cursor:pointer;color:#fff8ec;background:linear-gradient(100deg,#b3202f,var(--red) 55%,#e0485a);box-shadow:0 0 0 2px var(--gold) inset,0 8px 20px rgba(214,40,57,.35);text-shadow:0 1px 2px rgba(0,0,0,.35)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
#status{margin-top:14px;font-size:14px;color:var(--muted);min-height:22px}
#audioInfo{margin-top:6px;font-size:13px;color:var(--muted);min-height:18px}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hidden{display:none}
button.alt{margin-left:10px;background:#16402c;color:var(--ink);border:1px solid var(--gold);box-shadow:none}
body.pc canvas{z-index:0;pointer-events:auto;cursor:grab;touch-action:none}
body.pc canvas.drag{cursor:grabbing}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(10,31,23,.8);color:var(--muted);font-size:13px;z-index:5;pointer-events:none;white-space:nowrap}
#hud b{color:var(--ink)}
#dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,246,222,.85);z-index:5;pointer-events:none}
.opts{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chip{padding:9px 14px;border-radius:12px;font-size:14px;background:#16402c;color:var(--ink);border:1px solid rgba(242,193,78,.5);box-shadow:none;text-shadow:none}
.chip.on{background:linear-gradient(100deg,#f2c14e,#e0a526);color:#3a0d12;border-color:transparent}
.opts label{display:flex;align-items:center;gap:6px;margin-left:6px;cursor:pointer}
#bar{height:6px;border-radius:6px;background:#16402c;margin-top:14px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--red) 0 10px,#fff8ec 10px 20px);transition:width .25s}
#bar.done{display:none}
#endInfo{margin-top:16px;font-size:14px;color:var(--muted)}
#endInfo img{display:block;width:150px;height:150px;margin:8px 0;border-radius:10px;background:#fff;padding:6px}
#endInfo a{color:var(--gold)}
.room{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.room input{width:11ch;padding:10px 12px;border-radius:12px;border:1px solid rgba(242,193,78,.55);background:#0a1f17;color:var(--ink);font-size:16px;font-weight:700}
@media (max-width:560px){.panel{grid-template-columns:1fr;text-align:center}.panel img{max-width:180px;margin:0 auto}p{margin-inline:auto}}

#snow{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
#snow i{position:absolute;top:-12px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx,20px),105vh,0)}}
body:has(#ui.hidden) #snow,body.pc #snow{display:none}
.panel{z-index:1}
@media (prefers-reduced-motion:reduce){#snow{display:none}.panel::before{animation:none}}
#garland,.panel::before{content:"";position:absolute;pointer-events:none;background:url(./garland.svg) center top/auto 100% repeat-x;filter:drop-shadow(0 6px 7px rgba(0,0,0,.55));animation:glowpulse 3s ease-in-out infinite}
.panel::before{left:-3px;right:-3px;top:-10px;height:78px;border-radius:28px 28px 0 0}
#garland{position:fixed;left:0;right:0;top:0;height:100px;z-index:2}
@keyframes glowpulse{0%,100%{opacity:1}50%{opacity:.82}}
body:has(#ui.hidden) #garland,body.pc #garland{display:none}
@media (max-width:560px){#garland{height:66px}.panel::before{height:62px}.panel{padding-top:78px}}
@media (prefers-reduced-motion:reduce){#garland,.panel::before{animation:none}}

.panel .back{display:inline-block;margin-top:16px;color:var(--gold);font-size:14px;text-decoration:none;border-bottom:1px dotted var(--gold)}
.hint{font-size:14px;color:var(--gold);margin:0 0 16px}
#hud a{color:var(--gold);pointer-events:auto}
</style>
</head>
<body>
<div id="dot" class="hidden"></div><div id="hud" class="hidden"></div>
<div id="garland" aria-hidden="true"></div><div id="snow" aria-hidden="true"></div>
<main class="panel" id="ui">
  <img src="./guida.png" alt="Logo natalizio ISISS Matese">
  <div>
    <div class="kick">✦ Buon Natale · Merry Christmas ✦</div>
    <h1 id="t_title"></h1>
    <p id="t_intro"></p>
    <div class="opts"><button class="chip" data-lang="it">Italiano</button><button class="chip" data-lang="en">English</button></div>
    <p class="hint" id="t_hint"></p>
    <button id="start" disabled>Carico la sala…</button><button id="startPc" class="alt hidden">Anteprima da computer</button>
    <div id="bar"><i></i></div>
    <div id="status" role="status"></div>
    <a class="back" id="t_back" href="index.html">← Torna alla Natività</a>
  </div>
</main>
<script>
(function(){var el=document.getElementById("snow");if(!el)return;var f=document.createDocumentFragment();
for(var i=0;i<46;i++){var d=document.createElement("i"),z=2+Math.random()*5;
d.style.cssText="left:"+(Math.random()*100)+"%;width:"+z+"px;height:"+z+"px;animation-duration:"+(7+Math.random()*10)+"s;animation-delay:-"+(Math.random()*14)+"s;opacity:"+(.35+Math.random()*.55)+";--dx:"+(Math.random()*80-40)+"px";f.appendChild(d)}
el.appendChild(f)})();
</script>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<script type="module" src="./sala.js"></script>
</body>
</html>
