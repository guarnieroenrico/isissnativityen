<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Natività ISISS</title>
<style>
:root{--navy:#0d1630;--ink:#f4f6fb;--muted:#b4bfd6;--orange:#ff7a1a;--pink:#e6338f;--teal:#12b5c9;--green:#2fcf7a}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--navy);color:var(--ink)}
body{display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.panel{width:min(720px,100%);display:grid;grid-template-columns:minmax(120px,220px) 1fr;gap:28px;align-items:center;padding:28px;border-radius:28px;background:#131d3d;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.panel img{width:100%;height:auto;display:block}
h1{margin:0 0 10px;font-size:clamp(26px,5vw,40px);line-height:1.1}
p{margin:0 0 18px;color:var(--muted);line-height:1.55;max-width:46ch}
button{border:0;border-radius:16px;padding:15px 22px;font-size:17px;font-weight:800;cursor:pointer;color:#0d1630;background:linear-gradient(100deg,var(--orange),var(--pink) 45%,var(--teal) 80%,var(--green))}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.6)}
#status{margin-top:14px;font-size:14px;color:var(--muted);min-height:22px}
#audioInfo{margin-top:6px;font-size:13px;color:var(--muted);min-height:18px}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.hidden{display:none}
button.alt{margin-left:10px;background:#1c2a58;color:var(--ink);border:1px solid #3a4c88}
body.pc canvas{z-index:0;pointer-events:auto;cursor:grab;touch-action:none}
body.pc canvas.drag{cursor:grabbing}
#hud{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:10px 18px;border-radius:14px;background:rgba(13,22,48,.78);color:var(--muted);font-size:13px;z-index:5;pointer-events:none;white-space:nowrap}
#hud b{color:var(--ink)}
#dot{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,246,222,.85);z-index:5;pointer-events:none}
.opts{display:flex;align-items:center;gap:8px;margin:0 0 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.chip{padding:9px 14px;border-radius:12px;font-size:14px;background:#1c2a58;color:var(--ink);border:1px solid #3a4c88}
.chip.on{background:linear-gradient(100deg,var(--orange),var(--pink));color:#0d1630;border-color:transparent}
.opts label{display:flex;align-items:center;gap:6px;margin-left:6px;cursor:pointer}
#bar{height:6px;border-radius:6px;background:#1c2a58;margin-top:14px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--pink),var(--teal));transition:width .25s}
#bar.done{display:none}
#endInfo{margin-top:16px;font-size:14px;color:var(--muted)}
#endInfo img{display:block;width:150px;height:150px;margin:8px 0;border-radius:10px;background:#fff;padding:6px}
#endInfo a{color:var(--teal)}
.room{display:flex;align-items:center;gap:10px;margin:0 0 16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.room input{width:11ch;padding:10px 12px;border-radius:12px;border:1px solid #3a4c88;background:#0d1630;color:var(--ink);font-size:16px;font-weight:700}
@media (max-width:560px){.panel{grid-template-columns:1fr;text-align:center}.panel img{max-width:180px;margin:0 auto}p{margin-inline:auto}}
</style>
</head>
<body>
<div id="dot" class="hidden"></div><div id="hud" class="hidden"></div>
<main class="panel" id="ui">
  <img src="./logo.png" alt="Logo ISISS Matese">
  <div>
    <h1 id="t_title">La Natività dell’ISISS Matese</h1>
    <p id="t_intro"></p>
    <div class="opts"><button class="chip" data-lang="it">Italiano</button><button class="chip" data-lang="en">English</button><label id="narrWrap"><input type="checkbox" id="narr"> <span id="t_narr"></span></label></div>
    <label class="room"><span id="t_room"></span> <input id="roomCode" value="presepe" maxlength="20" autocapitalize="off" autocomplete="off" spellcheck="false"> <span id="t_roomHint"></span></label><br>
    <button id="start" disabled>Carico la natività…</button><button id="startPc" class="alt hidden">Anteprima da computer</button>
    <div id="bar"><i></i></div>
    <div id="status" role="status"></div>
    <div id="endInfo" class="hidden"></div>
    <div id="audioInfo"></div>
  </div>
</main>

<script type="module">

const newLoader = () => new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);

const startBtn = document.querySelector("#start"), pcBtn = document.querySelector("#startPc");
const statusEl = document.querySelector("#status");
const ui = document.querySelector("#ui");
const setStatus = t => statusEl.textContent = t;

/* ---------- Parametri regolabili ---------- */
const CFG = {
  model: "models/nativita.glb", // la natività intera, tutta in un solo file
  modelScale: 0.9,    // 1 = misura originale del file (Maria alta ~1 m, i Magi ~1,8 m)
  cowModel: "models/cow_idle.glb",  // la mucca animata, al posto di quella vecchia nella natività ("" = tieni la vecchia)
  cowScale: 0.61,     // quanto è grande la mucca (unità del modello): 0,61 la fa alta come la vecchia
  cowX: -1.155, cowY: -0.03, cowZ: -1.56,   // dove sta (unità del modello, rispetto alla mangiatoia): è il posto della vecchia mucca
  cowTurn: 0,         // rotazione della mucca (radianti): 0 = guarda verso la mangiatoia e verso di te
  cowSpeed: 1,        // velocità dell’animazione (1 = normale)
  mangerX: 0.04,      // punto del modello che finisce al centro (la mangiatoia), in unità del modello
  mangerZ: 0.56,
  magiFront: 6.0,     // il punto del gruppo dei Magi più vicino a te (unità del modello)
  carpetLead: 1.0,    // quanto il tappeto rosso precede i Magi: all’inizio ti trovi sul suo primo punto (m)
  carpetW: 1.1,       // larghezza del tappeto rosso (m): 1,1 arriva a toccare i due Magi
  carpetY: 0.012,     // altezza del tappeto dal pavimento (m)

  xrScale: 0.9,       // risoluzione nel visore (1 = massima, 0.8 = più veloce)
  starBeam: true,     // fascio di luce morbido che scende dalla stella sulla Sacra Famiglia
  song: "audio/canzone", // la canzone: nome SENZA estensione (va bene .mp3 .m4a .ogg .wav). "" = niente musica
  carillon: true,     // se in audio/ non c’è nessun file, suona un carillon natalizio generato dal browser
  songVolume: 0.5,    // da 0 a 1
  snow: true,         // neve che cade intorno a te
  snowCount: 600, snowRadius: 4, snowHeight: 3.4,   // quanti fiocchi, raggio (m) intorno a te, altezza (m)
  exposure: 1.0,      // luminosità generale (tone mapping ACES): alza o abbassa se la scena è troppo chiara/scura
  infoUrl: "",        // link (o pagina dell’open day) mostrato con un QR code quando la visita finisce. "" = niente
  guide: "guida.png", // il logo che fa da guida
  guideSize: 0.30,    // grandezza della guida (m)
  guideSide: 0.5,     // quanto sta a destra di te (m)
  guideAhead: 0.55,   // quanto sta davanti a te (m)
  near: 2.6,          // entro questa distanza (m) un poster guardato conta come "letto"
  spawnDelay: 1.5,    // secondi prima che la scena compaia
  gazeDeg: 16         // sguardo dentro questo angolo = poster evidenziato
};

/* ---------- Le stazioni della storia (modifica qui i testi) ----------
   side: 1 = la card guarda verso sinistra (sta a destra), -1 = guarda verso destra (sta a sinistra)

   (0 = mangiatoia, più grande = più vicino ai Magi) · art: immagine in art/ · focus: 0 = mostra la parte alta, 1 = la parte bassa */
const STATIONS = [
  { side:1, x:1.35, z:4.4, art:"art/magi.jpg", focus:.5,
    kicker:"Capitolo 1 · Il viaggio", title:"I Re Magi",
    body:["Da terre lontane, alcuni sapienti osservano una stella straordinaria e si mettono in cammino. La tradizione li ricorda come Gaspare, Melchiorre e Baldassarre. Attraversano deserti e regni, seguendo la luce che li conduce verso il Re appena nato.",

    quote:"La luce guida chi non smette di cercare.",

    en:{"kicker": "Chapter 1 · The journey", "title": "The Three Wise Men", "body": ["From distant lands, some wise men notice an extraordinary star and set out on a journey. Tradition remembers them as Caspar, Melchior and Balthazar. They cross deserts and kingdoms, following the light that leads them to the newborn King.", "Their journey becomes a symbol for all who seek with faith, perseverance and wonder."], "quote": "The light guides those who never stop searching.", "note": "Matthew 2:1–12"},
    guide:"Eccoli! I Magi vengono da molto lontano e viaggiano seguendo una stella." },

    kicker:"Capitolo 6 · I doni", title:"L’Adorazione dei Re Magi",
    body:["Giunti a Betlemme, i Re Magi si prostrarono davanti a Gesù e gli offrirono i loro doni: oro, incenso e mirra. L’oro era il segno della regalità, l’incenso richiamava la sua divinità, la mirra parlava della sua futura sofferenza e morte.",
          "I Magi, venuti da terre lontane, rappresentano tutti i popoli che si avvicinano a Cristo. Il loro gesto ci insegna che il valore di un dono non sta nel suo prezzo, ma nell’amore con cui viene offerto."],
    quote:"Il dono più prezioso è un cuore capace di amare.",
    note:"Matteo 2, 1–12", num:"06 / 09",
    en:{"kicker": "Chapter 6 · The gifts", "title": "The Adoration of the Magi", "body": ["Arriving in Bethlehem, the Magi knelt before Jesus and offered him their gifts: gold, frankincense and myrrh. Gold was a sign of kingship, frankincense recalled his divinity, myrrh spoke of his future suffering and death.", "The Magi, who came from far-off lands, represent all peoples drawing near to Christ. Their gesture teaches us that the value of a gift lies not in its price, but in the love with which it is given."], "quote": "The most precious gift is a heart able to love.", "note": "Matthew 2:1–12"},
    guide:"Oro, incenso e mirra: tre doni che raccontano chi è questo bambino." },
  { side:-1, x:-4.4, z:4.0, art:"art/stella.jpg", focus:.5,
    kicker:"Capitolo 3 · La stella", title:"La stella di Betlemme",
    body:["Nel cielo brillò una stella straordinaria, segno della nascita del Salvatore. Non era solo una luce da ammirare, ma una guida che indicava la strada ai Magi, anche quando il cammino sembrava incerto.",
          "Ancora oggi, quella stella ci ricorda che Dio non smette di illuminare il nostro cammino: nei gesti di bontà, nelle parole vere, nelle persone che ci aiutano a ritrovare la speranza."],
    quote:"Anche la notte più buia può essere illuminata da una luce.",
    note:"Matteo 2, 1–10", num:"03 / 09",
    en:{"kicker": "Chapter 3 · The star", "title": "The Star of Bethlehem", "body": ["An extraordinary star shone in the sky, a sign of the Savior’s birth. It was not just a light to admire, but a guide that showed the Magi the way, even when the road seemed uncertain.", "Even today, that star reminds us that God never stops lighting our path: in acts of kindness, in honest words, in the people who help us find hope again."], "quote": "Even the darkest night can be lit by a light.", "note": "Matthew 2:1–10"},
    guide:"La stella si è fermata proprio qui. Il viaggio è finito: guarda la mangiatoia!" },
  { side:-1, x:-1.75, z:-.1, art:"art/famiglia.jpg", focus:.6,
    kicker:"Capitolo 2 · La Sacra Famiglia", title:"Maria, Giuseppe e Gesù",
    body:["Maria e Giuseppe, dopo un lungo viaggio, arrivarono a Betlemme. Non trovarono un luogo adatto, ma in una semplice stalla si compì il mistero più grande.",
          "Maria accolse con amore il Figlio di Dio, Giuseppe lo custodì con fede e coraggio. In quella notte speciale, la loro famiglia diventò il segno di una speranza nuova per tutto il mondo."],
    quote:"Nel silenzio di una stalla, l’amore di una famiglia accolse la luce del mondo.",
    note:"Luca 2, 1–7", num:"02 / 09",
    en:{"kicker": "Chapter 2 · The Holy Family", "title": "Mary, Joseph and Jesus", "body": ["After a long journey, Mary and Joseph arrived in Bethlehem. They found no fitting place, but in a simple stable the greatest mystery came to pass.", "Mary welcomed the Son of God with love, Joseph protected him with faith and courage. On that special night, their family became the sign of a new hope for the whole world."], "quote": "In the silence of a stable, a family’s love welcomed the light of the world.", "note": "Luke 2:1–7"},
    guide:"Maria, Giuseppe e Gesù: il cuore del presepe. Fermiamoci un momento in silenzio." }
];

/* ---------- Tappeto rosso: parte dove ti trovi tu, passa nel varco tra i due Magi e arriva davanti alla mangiatoia ----------
   punti [x, z] in unità del modello rispetto alla mangiatoia; il primo è calcolato da magiFront + carpetLead */
const GAP = -1.825;                    // centro del varco tra i due gruppi di Magi
const CARPET = [[GAP, (CFG.magiFront - CFG.mangerZ) + CFG.carpetLead/CFG.modelScale], [GAP, 4.6], [GAP, 3.3], [-1.7, 2.8], [-1.35, 2.4], [-.95, 2.15], [-.55, 2.0]];


/* ---------- Lingue: italiano / inglese ---------- */
const I18N = {
  it: {
    title:"La Natività dell’ISISS Matese",
    intro:"La natività della nostra scuola, con i poster accanto ai personaggi e la guida dell’ISISS Matese al tuo fianco. Sul computer cammini con la tastiera e guardi trascinando il mouse.",
    narr:"Narratore (voce)", room:"Stanza con un amico:", roomHint:"(scrivete lo stesso nome)",
    loading:"Sto caricando il modello…", pct:(p,mb) => `Carico la natività… ${p}% (${mb} MB)`, pctNoTotal:mb => `Carico la natività… ${mb} MB`,
    btnLoad:"Carico la natività…", btnAR:"Entra nella realtà mista", btnPc:"Anteprima da computer", btnPreview:"Avvia l’anteprima",
    readyXR:"Pronto. Guardati intorno: la Natività compare da sola.", readyPC:"Pronto. La Natività compare da sola dopo un istante.",
    ended:"Sessione terminata. Puoi rientrare quando vuoi.", reenter:"Rientra nell’esperienza",
    hello:"Ciao! Sono la guida dell’ISISS Matese. Questa è la natività della nostra scuola: ti accompagno io nella visita.",
    tip:"Premi il grilletto: puoi toccare la mucca, la stella o la mangiatoia, oppure mandare un cuore.",
    joined:"Un amico è entrato nel presepe! Salutalo con il grilletto.", left:"L’amico è uscito dal presepe.",
    waiting:r => `Aspetto un amico nella stanza «${r}»: digli di scrivere lo stesso nome.`,
    magic:"Gloria in excelsis Deo! Gli angeli cantano per voi.", finaleSay:"Hai visto tutto! Grazie della visita e Buon Natale!",
    fTitle:"Grazie della visita!", fSub:"Buon Natale dall’ISISS Matese",
    fBody:"Questa natività in realtà aumentata nasce nei laboratori di Informatica dell’ISISS Matese. Chiedi ai nostri studenti come si costruiscono esperienze come questa!",
    fClose:"Premi il grilletto per chiudere", endInfo:"Vuoi saperne di più?",
    hud:"<b>Trascina</b> col mouse per guardare · <b>W A S D</b> o frecce per camminare · <b>Clic</b> tocca mucca, stella, mangiatoia · <b>Maiusc</b> più veloce · <b>R</b> ricomincia · <b>M</b> musica"
  },
  en: {
    title:"The ISISS Matese Nativity",
    intro:"Our school’s nativity scene, with posters beside the characters and the ISISS Matese guide by your side. On a computer you walk with the keyboard and look around by dragging the mouse.",
    narr:"Narrator (voice)", room:"Room with a friend:", roomHint:"(type the same name)",
    loading:"Loading the model…", pct:(p,mb) => `Loading the nativity… ${p}% (${mb} MB)`, pctNoTotal:mb => `Loading the nativity… ${mb} MB`,
    btnLoad:"Loading the nativity…", btnAR:"Enter mixed reality", btnPc:"Preview on computer", btnPreview:"Start the preview",
    readyXR:"Ready. Look around: the Nativity appears by itself.", readyPC:"Ready. The Nativity appears by itself in a moment.",
    ended:"Session over. You can come back in whenever you like.", reenter:"Re-enter the experience",
    hello:"Hello! I’m the ISISS Matese guide. This is our school’s nativity scene: I’ll walk you through the visit.",
    tip:"Press the trigger: you can touch the cow, the star or the manger, or send a heart.",
    joined:"A friend has joined the nativity! Say hello with the trigger.", left:"Your friend has left the nativity.",
    waiting:r => `Waiting for a friend in room “${r}”: ask them to type the same name.`,
    magic:"Gloria in excelsis Deo! The angels are singing for you.", finaleSay:"You’ve seen it all! Thank you for visiting, and Merry Christmas!",
    fTitle:"Thank you for visiting!", fSub:"Merry Christmas from ISISS Matese",
    fBody:"This augmented-reality nativity was born in the Computer Science labs of ISISS Matese. Ask our students how experiences like this are built!",
    fClose:"Press the trigger to close", endInfo:"Want to know more?",
    hud:"<b>Drag</b> the mouse to look · <b>W A S D</b> or arrows to walk · <b>Click</b> touches cow, star, manger · <b>Shift</b> faster · <b>R</b> restart · <b>M</b> music"
  }
};
let LANG = "it";
try { LANG = localStorage.getItem("nat-lang") || ((navigator.language || "it").toLowerCase().startsWith("it") ? "it" : "en"); } catch (_) {}
const tr = k => I18N[LANG][k];
const stText = st => LANG === "en" && st.en ? { ...st, ...st.en } : st;

/* ---------- Utilità ---------- */
const easeOutBack = t => { const c=1.70158; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };
const clamp01 = v => Math.min(1, Math.max(0, v));
const FONT = "system-ui,-apple-system,'Segoe UI',sans-serif", SERIF = "Georgia,'Times New Roman',serif";

function roundRect(g,x,y,w,h,r){
  g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}
function wrap(g, text, maxW){
  const lines = []; let line = "";
  for (const w of text.split(" ")){
    const test = line ? line+" "+w : w;
    if (g.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}
function star(g,x,y,r){
  g.beginPath();
  for (let i=0;i<8;i++){ const a=i*Math.PI/4 - Math.PI/2, rr = i%2 ? r*0.38 : r; g.lineTo(x+Math.cos(a)*rr, y+Math.sin(a)*rr); }
  g.closePath(); g.fill();
}

/* ---------- Poster (disegnati su canvas, nello stile delle carte "Luce e Fede") ---------- */
const PW = 1024, PH = Math.round(PW * CFG.posterH / CFG.posterW);
const GOLD = "rgba(255,210,122,.95)";
const loadImg = src => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; });
const logoPromise = loadImg("logo.png");

function drawPoster(st, idx, total, art, logo, cv){
  const c = cv || document.createElement("canvas"); c.width = PW; c.height = PH;
  const g = c.getContext("2d"), M = 92, W = PW - M*2, CX = PW/2;

  // fondo blu notte con stelline
  roundRect(g,8,8,PW-16,PH-16,34);
  const bg = g.createLinearGradient(0,0,PW*.5,PH);
  bg.addColorStop(0,"#0c1c48"); bg.addColorStop(.5,"#0a1431"); bg.addColorStop(1,"#070d24");
  g.fillStyle = bg; g.fill();
  g.save(); g.clip();
  let seed = 11 + idx*17; const rnd = () => (seed = (seed*16807) % 2147483647)/2147483647;
  for (let i=0;i<170;i++){
    g.fillStyle = `rgba(190,215,255,${.12 + rnd()*.5})`;
    g.beginPath(); g.arc(rnd()*PW, rnd()*PH, .6 + rnd()*1.5, 0, Math.PI*2); g.fill();
  }

  // illustrazione in alto, che sfuma nel blu
  const AX = 46, AY = 46, AW = PW - 92, AH = 640;
  if (art){
    g.save(); roundRect(g,AX,AY,AW,AH,24); g.clip();
    const k = Math.max(AW/art.width, AH/art.height), dw = art.width*k, dh = art.height*k;
    g.drawImage(art, AX - (dw-AW)/2, AY - (dh-AH)*(st.focus ?? .5), dw, dh);
    const fd = g.createLinearGradient(0, AY+AH-240, 0, AY+AH);
    fd.addColorStop(0,"rgba(10,20,49,0)"); fd.addColorStop(1,"rgba(10,20,49,1)");
    g.fillStyle = fd; g.fillRect(AX, AY+AH-240, AW, 240);
    g.restore();
  }
  g.restore();

  // cornice dorata doppia con stelline negli angoli
  roundRect(g,14,14,PW-28,PH-28,30); g.lineWidth = 4; g.strokeStyle = "rgba(255,210,122,.9)"; g.stroke();
  roundRect(g,30,30,PW-60,PH-60,22); g.lineWidth = 1.6; g.strokeStyle = "rgba(255,210,122,.4)"; g.stroke();
  g.fillStyle = GOLD;
  for (const [x,y] of [[22,22],[PW-22,22],[22,PH-22],[PW-22,PH-22]]) star(g, x, y, 11);

  // etichetta del capitolo, a cavallo tra illustrazione e testo

}

function updateStar(t){                // la stella fluttua, dondola e brilla; la coda ondeggia
  const U = starObj.userData;
  starObj.position.set(Math.sin(t*.45)*.07, CFG.starY + Math.sin(t*1.05)*.05 + Math.sin(t*.37)*.025, -.1 + Math.cos(t*.4)*.05);
  U.core.rotation.set(Math.sin(t*.5)*.12, Math.sin(t*.6)*.6, Math.sin(t*.8)*.08);
  const pulse = (1 + .07*Math.sin(t*2.3) + .03*Math.sin(t*5.1))*(1 + starBoost*.7);
  U.core.scale.setScalar(.15*pulse);
  U.halos.forEach((h, i) => { const k = pulse + (i ? 0 : .06*Math.sin(t*1.3)); h.scale.set(h.userData.base*k, h.userData.base*k, 1); });
  U.rays.material.rotation = t*.12; U.rays.scale.setScalar((.95 + .1*Math.sin(t*3.1))*(1 + starBoost*1.6));
  U.tail.rotation.z = .62 + Math.sin(t*.9)*.05; U.tail.scale.x = 1 + .06*Math.sin(t*1.7);
  for (const sp of U.sparks){
    const d = sp.userData, u = (t*d.sp + d.ph) % 1, w = (1-u)*.07;

async function fetchModel(){
  const grab = async url => {
    const r = await fetch(url); if (!r.ok) throw new Error(url + ": HTTP " + r.status);
    const total = +r.headers.get("content-length") || 0, rd = r.body && r.body.getReader();
    if (!rd) return r.arrayBuffer();
    const parts = []; let got = 0;
    for (;;){
      const { done, value } = await rd.read(); if (done) break;
      parts.push(value); got += value.length;
      const mb = (got/1048576).toFixed(1);
      setStatus(total ? tr("pct")(Math.min(100, Math.round(got/total*100)), mb) : tr("pctNoTotal")(mb)); setBar(total ? got/total*.9 : .5);
    }
    const u8 = new Uint8Array(got); let o = 0; for (const p of parts){ u8.set(p, o); o += p.length; }
    return u8.buffer;
  };
  try { const ab = await grab(CFG.model); if (new Uint8Array(ab, 0, 4).join() === "103,108,84,70") return ab; } catch (_) {}   // prima la cartella models/
  const rs = await fetch("nativita.txt"); if (!rs.ok) throw new Error(CFG.model + " non trovato");                          // altrimenti la copia incorporata
  const bin = atob((await rs.text()).trim()), u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
let cowMixer = null;
function loadCow(model){              // carica la mucca animata e toglie quella vecchia; se qualcosa va storto resta la vecchia
  if (!CFG.cowModel) return Promise.resolve();
  return new Promise(resolve => {
    newLoader().load(CFG.cowModel, gltf => {
      try {
        const cow = gltf.scene; cowObj = cow;
        cow.scale.setScalar(CFG.cowScale);
        cow.position.set(CFG.cowX, CFG.cowY, CFG.cowZ);
        cow.rotation.y = CFG.cowTurn;
        cow.traverse(o => {
          if (!o.isMesh) return;
          o.frustumCulled = false;     // il corpo si muove: non farlo sparire ai bordi dello schermo
          for (const k of ["map","normalMap","aoMap"]) if (o.material[k]) o.material[k].anisotropy = 4;
        });
        let old = null;                // la vecchia mucca è il gruppo che contiene la mesh "Line01…" (corpo) e le due sfere (occhi)
        model.traverse(o => { if (o.isMesh && o.name.startsWith("Line01_aiStandardSurface")) old = o; });
        while (old && old.parent && old.parent !== model) old = old.parent;
        if (old && old.parent === model){
          model.remove(old);
          old.traverse(o => { if (o.isMesh){ o.geometry.dispose(); const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => m.dispose()); } });
        }
        model.add(cow);                // aggiunta dopo il blocco delle matrici: le ossa devono potersi muovere
        if (gltf.animations.length){
          cowMixer = new THREE.AnimationMixer(cow);
          const a = cowMixer.clipAction(gltf.animations[0]); a.timeScale = CFG.cowSpeed; a.play();
        }
      } catch (e){ console.error("Mucca animata non inserita:", e); }
      resolve();
    }, undefined, err => { console.warn("Mucca animata non trovata, resta quella vecchia:", err); resolve(); });
  });
}
async function loadNativity(){
  setStatus(tr("pctNoTotal")("0.0"));
  const buf = await fetchModel();
  return new Promise((resolve, reject) => {
    newLoader().parse(buf, "", gltf => {
      const model = gltf.scene, s = CFG.modelScale;
      model.scale.setScalar(s);
      model.traverse(o => { if (o.isMesh) for (const k of ["map","normalMap","aoMap"]) if (o.material[k]) o.material[k].anisotropy = 4; });
      model.position.set(-CFG.mangerX*s, 0, -CFG.mangerZ*s);   // la mangiatoia al centro
      model.updateMatrixWorld(true);
      model.position.y = -new THREE.Box3().setFromObject(model).min.y;  // il punto più basso (paglia) appoggia sul pavimento
      model.traverse(o => {
        if (!o.isMesh) return;
        const m = o.material;
        if (m.alphaTest > 0){            // paglia: tanti strati con trasparenza, costosa. Materiale semplice al posto di quello fisico
          o.material = new THREE.MeshLambertMaterial({ map:m.map, color:m.color, alphaTest:m.alphaTest, side:THREE.DoubleSide, reflectivity:0 });
          m.dispose();
        } else m.side = THREE.FrontSide;  // statuine chiuse: non serve disegnare anche il retro dei triangoli
      });
      model.updateMatrix();
      model.traverse(o => { o.matrixAutoUpdate = false; });   // il modello non si muove: niente ricalcoli a ogni frame
      loadCow(model).then(() => resolve(model));              // la mucca animata resta fuori dal blocco
    }, err => reject(err));
  });
}

// Se in audio/ c’è un file (canzone.mp3 / .m4a / .ogg / .wav) suona quello, altrimenti un carillon natalizio generato dal browser.
let song = null, songState = "loading", actx = null, bus = null, synthTimer = 0, vol = 0, fadeT = 0, musicOn = false, step = 0, nextT = 0;
const audioInfo = t => { const e = document.querySelector("#audioInfo"); if (e) e.textContent = t; };
function setupSong(){
  if (CFG.song === ""){ songState = "none"; audioInfo("🔇 Musica disattivata"); return; }
  const list = [".mp3",".m4a",".ogg",".wav"].map(e => CFG.song + e); let k = 0;
  song = new Audio(); song.loop = true; song.preload = "auto"; song.volume = 0;
  const tryNext = () => {
    if (k < list.length){ song.src = list[k++]; if (musicOn) song.play().catch(() => {}); return; }
    song = null; songState = "none";
    audioInfo(CFG.carillon ? "🎵 Nessun file in audio/: uso il carillon integrato" : "🔇 Nessuna canzone trovata nella cartella audio/");
    if (musicOn && CFG.carillon) startSynth();
  };
  song.addEventListener("error", () => { if (songState === "loading") tryNext(); });
  song.addEventListener("canplay", () => { if (songState === "loading"){ songState = "ok"; audioInfo("🔊 Canzone pronta: " + song.src.split("/").pop()); } });
  song.addEventListener("playing", () => fadeSong(CFG.songVolume));
  tryNext();
}
function setVol(v){ vol = v; const k = Math.min(1, v*duckK); if (song) song.volume = k; if (bus) bus.gain.value = k; }
function fadeSong(target){          // sale o scende piano piano; a zero ferma tutto
  clearInterval(fadeT);
  fadeT = setInterval(() => {
    const d = target - vol;
    if (Math.abs(d) < .03){ setVol(target); clearInterval(fadeT); if (!target) stopMusic(); return; }
    setVol(Math.min(1, Math.max(0, vol + Math.sign(d)*.03)));
  }, 60);
}
function stopMusic(){ musicOn = false; if (song) song.pause(); clearInterval(synthTimer); if (bus) bus.gain.value = 0; }
function playSong(){                // va chiamata dentro un tocco dell’utente: i browser non permettono l’audio automatico prima
  if (musicOn) return; musicOn = true;
  if (song && songState !== "none") song.play().catch(e => { if (e.name === "NotAllowedError") musicOn = false; });
  else if (CFG.carillon) startSynth();
}

// carillon: arpeggi di campanelle su Do - La min - Fa - Sol, con un po’ di eco
const CHORDS = [[60,64,67,72],[57,60,64,69],[53,57,60,65],[55,59,62,67]];
const midi = n => 440*Math.pow(2, (n-69)/12);
function bell(t, f, v, dest){
  const g = actx.createGain(), o1 = actx.createOscillator(), o2 = actx.createOscillator(), g2 = actx.createGain();
  o1.frequency.value = f; o2.frequency.value = f*2.76; g2.gain.value = .22;   // la seconda onda dà il suono di campana
  o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest || bus);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t+.012); g.gain.exponentialRampToValueAtTime(.0001, t+2);
  o1.start(t); o2.start(t); o1.stop(t+2.1); o2.stop(t+2.1);
}
function playStep(t){
  const bar = Math.floor(step/8) % 4, i = step % 8, ch = CHORDS[bar];
  bell(t, midi(ch[[0,1,2,3,2,1,2,1][i]]), .26);
  if (i === 0) bell(t, midi(ch[0]-12), .34);
  if (i === 0 || i === 4 || i === 6) bell(t, midi(ch[(bar*3 + i)%4] + 12), .18);
}
function startSynth(){
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  if (!bus){
    bus = actx.createGain(); bus.gain.value = 0; bus.connect(actx.destination);
    const dl = actx.createDelay(1), fb = actx.createGain(), wet = actx.createGain();
    dl.delayTime.value = .36; fb.gain.value = .38; wet.gain.value = .5;
    bus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(actx.destination);
  }
  nextT = actx.currentTime + .15; clearInterval(synthTimer);
  synthTimer = setInterval(() => { while (nextT < actx.currentTime + .6){ playStep(nextT); nextT += .5; step++; } }, 200);
  fadeSong(CFG.songVolume);
}

  for (; fs >= 34; fs -= 2){ g.font = `600 ${fs}px ${FONT}`; lines = wrap(g, text, W-110); if (lines.length*fs*1.3 <= bh-50) break; }
  let y = 8 + (bh - lines.length*fs*1.3)/2 + fs*.98;

function updateGuide(dt, t, since){
  const G = guide; G.now = t;
  const e = Math.max(0.001, easeOutBack(clamp01((since - 1.2)/.7)));
  G.grp.visible = since > 1.2; G.grp.scale.setScalar(e);
  if (!G.introDone && since > 1.9){ G.introDone = true; say(tr("hello"), 10); }   // si presenta una volta sola, poi resta in silenzio

  right.set(-fwd.z, 0, fwd.x);                 // sta accanto a te, un po’ avanti sulla destra
  tgt.copy(head).addScaledVector(right, CFG.guideSide).addScaledVector(fwd, CFG.guideAhead);
  tgt.y = head.y - .12 + Math.sin(t*1.6)*.03;
  if (!G.ready){ G.pos.copy(tgt); G.ready = true; }
  G.pos.lerp(tgt, 1 - Math.exp(-dt*2.5));       // ti segue con un po’ di ritardo, come se fluttuasse
  G.grp.position.copy(G.pos);
  G.grp.lookAt(head.x, G.pos.y, head.z);
  G.logo.rotation.set(0, Math.sin(t*.9)*.25, Math.sin(t*1.3)*.05);

  const k = t < G.msgUntil ? 1 : 0.001, b = G.bubble.scale.x;
  G.bubble.scale.setScalar(b + (k - b)*(1 - Math.exp(-dt*8)));
  G.bubble.visible = b > .01 || k === 1;
}

function makeCarpet(){               // nastro che segue la curva dei punti CARPET, appoggiato sul pavimento
  const s = CFG.modelScale, w = CFG.carpetW;
  const curve = new THREE.CatmullRomCurve3(CARPET.map(([x, z]) => new THREE.Vector3(x*s, CFG.carpetY, z*s)), false, "centripetal");
  const N = 90, pos = [], nor = [], uv = [], idx = []; let len = 0, prev = null;
  for (let i=0; i<=N; i++){
    const p = curve.getPoint(i/N), tg = curve.getTangent(i/N), l = Math.hypot(tg.x, tg.z) || 1;
    const ox = -tg.z/l*w/2, oz = tg.x/l*w/2;                         // perpendicolare orizzontale = metà larghezza
    if (prev) len += p.distanceTo(prev); prev = p;
    pos.push(p.x-ox, p.y, p.z-oz, p.x+ox, p.y, p.z+oz); nor.push(0,1,0, 0,1,0); uv.push(0, len/w, 1, len/w);
    if (i < N){ const a = i*2; idx.push(a, a+1, a+2, a+1, a+3, a+2); }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("normal", new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);
  const tex = carpetTexture();
  const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color:0xffffff, map:tex }));   // rosso con il logo inciso
  m.renderOrder = 1; return m;
}

function carpetTexture(){            // tappeto rosso con il logo ISISS Matese inciso (tono su tono) e filetto dorato
  const TW = 512, TH = 768, c = document.createElement("canvas"); c.width = TW; c.height = TH;
  const g = c.getContext("2d"), RED = "#b3142c";
  g.fillStyle = RED; g.fillRect(0, 0, TW, TH);
  g.strokeStyle = "rgba(255,210,122,.85)"; g.lineWidth = 5; g.strokeRect(22, -10, TW-44, TH+20);       // filetto dorato ai lati (si ripete senza stacchi)
  g.strokeStyle = "rgba(255,210,122,.45)"; g.lineWidth = 2; g.strokeRect(36, -10, TW-72, TH+20);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  tex.wrapS = THREE.ClampToEdgeWrapping; tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(1, 1/1.5);          // una tessera = 1,5 larghezze di tappeto: un logo ogni 1,5 larghezze
  logoPromise.then(img => {
    if (!img) return;
    const L = 400, x = (TW - L)/2, y = (TH - L)/2;
    // silhouette del logo (solo l'alpha) e dettagli interni in scala di grigi, per un'incisione che mantiene scritte e icone
    const sil = document.createElement("canvas"); sil.width = sil.height = L;
    const sg = sil.getContext("2d"); sg.drawImage(img, 0, 0, L, L);
    const id = sg.getImageData(0, 0, L, L), d = id.data, eng = sg.createImageData(L, L), e = eng.data;
    for (let i=0; i<d.length; i+=4){
      const lum = (.3*d[i] + .59*d[i+1] + .11*d[i+2]) / 255, k = .42 + .38*lum;          // più chiaro = meno profondo
      e[i] = 179*k*.62; e[i+1] = 20*k*.62; e[i+2] = 44*k*.62; e[i+3] = d[i+3];            // rosso scuro, incavato
    }
    const tint = (col) => { const t = document.createElement("canvas"); t.width = t.height = L; const tg = t.getContext("2d");
      tg.drawImage(sil, 0, 0); tg.globalCompositeOperation = "source-in"; tg.fillStyle = col; tg.fillRect(0, 0, L, L); return t; };
    const hi = tint("rgba(255,170,170,.55)"), lo = tint("rgba(40,0,8,.65)");
    const body = document.createElement("canvas"); body.width = body.height = L; body.getContext("2d").putImageData(eng, 0, 0);
    g.drawImage(hi, x+2.5, y+2.5);     // bordo illuminato in basso a destra
    g.drawImage(lo, x-2.5, y-2.5);     // ombra interna in alto a sinistra
    g.drawImage(body, x, y);           // fondo dell'incisione
    tex.needsUpdate = true;
  });
  return tex;
}

function makeSnow(){                 // fiocchi come quadratini sempre rivolti verso di te; la caduta è calcolata dalla GPU
  const N = CFG.snowCount, cn = [[-1,-1],[1,-1],[1,1],[-1,1]];
  const pos = new Float32Array(N*12), corner = new Float32Array(N*8), seed = new Float32Array(N*16), size = new Float32Array(N*4), idx = new Uint32Array(N*6);
  for (let i=0;i<N;i++){
    const sx = Math.random(), sy = Math.random(), sz = Math.random(), sw = .25 + Math.random()*.4, sz2 = .008 + Math.random()*.014;
    for (let v=0; v<4; v++){
      corner.set(cn[v], (i*4+v)*2); seed.set([sx, sy, sz, sw], (i*4+v)*4); size[i*4+v] = sz2;
    }
    idx.set([0,1,2,0,2,3].map(k => k + i*4), i*6);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  geo.setAttribute("corner", new THREE.BufferAttribute(corner, 2));
  geo.setAttribute("seed", new THREE.BufferAttribute(seed, 4));
  geo.setAttribute("aSize", new THREE.BufferAttribute(size, 1));
  geo.setIndex(new THREE.BufferAttribute(idx, 1));
  const mat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide,
    uniforms:{ uTime:{value:0}, uR:{value:CFG.snowRadius}, uH:{value:CFG.snowHeight}, uHead:{value:new THREE.Vector3()}, uFade:{value:0} },
    vertexShader:`
      uniform float uTime, uR, uH; uniform vec3 uHead;
      attribute vec2 corner; attribute vec4 seed; attribute float aSize;
      varying vec2 vC; varying float vA;
      void main(){
        float D = 2.0*uR;
        float px = mod(seed.x*D + sin(uTime*.6 + seed.y*30.0)*.25 - uHead.x + uR, D) - uR + uHead.x;   // i fiocchi restano intorno a te
        float pz = mod(seed.z*D + cos(uTime*.5 + seed.x*30.0)*.25 - uHead.z + uR, D) - uR + uHead.z;
        float py = mod(seed.y*uH - uTime*seed.w, uH);                                                   // e cadono dall’alto
        vec3 c = vec3(px, py, pz);
        vec3 r = vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]);
        vec3 u = vec3(viewMatrix[0][1], viewMatrix[1][1], viewMatrix[2][1]);
        float d = distance(c, cameraPosition);
        vA = smoothstep(.25, .9, d) * smoothstep(0., .35, py) * smoothstep(uH, uH-.5, py);              // spariscono vicino a te, a terra e in alto
        vC = corner;
        gl_Position = projectionMatrix * viewMatrix * vec4(c + (r*corner.x + u*corner.y)*aSize, 1.);
      }`,
    fragmentShader:`
      uniform float uFade; varying vec2 vC; varying float vA;
      void main(){ float a = smoothstep(1., .25, length(vC)) * vA * .9 * uFade; if (a < .01) discard; gl_FragColor = vec4(.96, .98, 1., a); }`
  });
  const m = new THREE.Mesh(geo, mat); m.frustumCulled = false; m.renderOrder = 5;
  return m;
}

let sfx = null, amb = null, duckK = 1;
function ensureAudio(){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
    if (!sfx){ sfx = actx.createGain(); sfx.gain.value = .9; sfx.connect(actx.destination); }
  } catch (e) { console.warn("Audio non disponibile:", e); }
}
function pannerAt(w){
  const p = actx.createPanner(); p.panningModel = "HRTF"; p.distanceModel = "inverse"; p.refDistance = 1; p.rolloffFactor = 1.3;
  if (p.positionX){ p.positionX.value = w.x; p.positionY.value = w.y; p.positionZ.value = w.z; } else p.setPosition(w.x, w.y, w.z);
  p.connect(sfx); return p;
}
function sfxMoo(w){
  if (!actx || !sfx) return;
  const t = actx.currentTime, out = pannerAt(w), o = actx.createOscillator(), lfo = actx.createOscillator(), lg = actx.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(150, t); o.frequency.linearRampToValueAtTime(118, t+.25); o.frequency.linearRampToValueAtTime(92, t+1.25);
  lfo.frequency.value = 5.5; lg.gain.value = 4; lfo.connect(lg); lg.connect(o.frequency);
  const f = actx.createBiquadFilter(); f.type = "lowpass"; f.Q.value = 6;
  f.frequency.setValueAtTime(380, t); f.frequency.linearRampToValueAtTime(900, t+.3); f.frequency.linearRampToValueAtTime(330, t+1.25);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t+.12); g.gain.setValueAtTime(.55, t+.9); g.gain.linearRampToValueAtTime(0, t+1.35);
  o.connect(f); f.connect(g); g.connect(out); o.start(t); lfo.start(t); o.stop(t+1.4); lfo.stop(t+1.4);
}
function sfxBells(w, notes, gap, vol){
  if (!actx || !sfx) return;
  const out = pannerAt(w), t0 = actx.currentTime + .02;
  notes.forEach((n, i) => bell(t0 + i*gap, midi(n), vol, out));
}
const SFX_STAR = [84, 88, 91], SFX_LULLABY = [67, 71, 74, 79, 74, 71], SFX_GLORIA = [72, 76, 79, 84, 88, 91, 96, 91];
function startAmbience(){
  if (!actx || !sfx || amb) return;
  const len = actx.sampleRate*2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0); let b = 0;
  for (let i=0;i<len;i++){ b = (b + .02*(Math.random()*2 - 1))/1.02; d[i] = b*3.5; }      // rumore "marrone": vento lontano
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 380; bp.Q.value = .5;
  const g = actx.createGain(), lfo = actx.createOscillator(), lg = actx.createGain(); g.gain.value = .05;
  lfo.frequency.value = .12; lg.gain.value = .025; lfo.connect(lg); lg.connect(g.gain);
  src.connect(bp); bp.connect(g); g.connect(sfx); src.start(); lfo.start();
  amb = { src, lfo, timer:0 };
  const far = () => {                                                                       // ogni tanto una campanella lontana, da una direzione a caso
    if (!amb) return;
    const a = Math.random()*6.28, w = root.localToWorld(nat.position.clone()); w.x += Math.cos(a)*3.5; w.z += Math.sin(a)*3.5; w.y = 1.6;

    amb.timer = setTimeout(far, 7000 + Math.random()*7000);
  };
  amb.timer = setTimeout(far, 5000);
}
function stopAmbience(){

}

/* ---------- Effetti: cuori, particelle, angeli ---------- */
const fxList = [];
let heartTex = null, angelTex = null, bigGlow = null, starBoost = 0;
function heartTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
  g.shadowColor = "#ff5c8a"; g.shadowBlur = 14; g.fillStyle = "#ff5c8a"; g.beginPath(); g.moveTo(64, 108);
  g.bezierCurveTo(8, 70, 18, 20, 64, 44); g.bezierCurveTo(110, 20, 120, 70, 64, 108); g.fill();
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function angelTexture(){
  const c = document.createElement("canvas"); c.width = c.height = 256; const g = c.getContext("2d");
  const r = g.createRadialGradient(128,128,10,128,128,128); r.addColorStop(0,"rgba(255,230,160,.55)"); r.addColorStop(1,"rgba(255,200,100,0)");
  g.fillStyle = r; g.fillRect(0,0,256,256);
  const wing = dir => {                                           // ali a piume
    for (let k=0;k<5;k++){
      g.save(); g.translate(128 + dir*14, 112); g.rotate(dir*(-.15 - k*.2));
      const gr = g.createLinearGradient(0,0,dir*(98 - k*8),0); gr.addColorStop(0,"rgba(255,255,255,.98)"); gr.addColorStop(1,"rgba(255,236,190,.85)");
      g.fillStyle = gr; g.beginPath(); g.ellipse(dir*(48 - k*3), 0, 52 - k*6, 13, 0, 0, Math.PI*2); g.fill(); g.restore();
    }
  };
  wing(-1); wing(1);
  g.fillStyle = "#fffaf0"; g.beginPath(); g.moveTo(128, 100); g.lineTo(100, 214); g.quadraticCurveTo(128, 226, 156, 214); g.closePath(); g.fill();   // veste
  g.fillStyle = "#ffe3bd"; g.beginPath(); g.arc(128, 84, 18, 0, Math.PI*2); g.fill();                                                     // volto
  g.strokeStyle = "#ffd27a"; g.lineWidth = 5; g.shadowColor = "#ffd27a"; g.shadowBlur = 10; g.beginPath(); g.ellipse(128, 58, 20, 6, 0, 0, Math.PI*2); g.stroke(); // aureola
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function addFx(obj, parent, dur, upd){ parent.add(obj); fxList.push({ obj, parent, t0:-1, dur, upd }); }
function spawnHeart(local){                                 // local = punto nelle coordinate del presepe
  heartTex = heartTex || heartTexture();
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:heartTex, transparent:true, depthWrite:false, toneMapped:false }));
  sp.renderOrder = 6; const p0 = local.clone(), sw = Math.random() - .5;
  addFx(sp, root, 1.8, (u, o) => { o.position.set(p0.x + Math.sin(u*5 + sw*6)*.04, p0.y + u*.55, p0.z); const k = .24*Math.min(1, u*6); o.scale.set(k, k, 1); o.material.opacity = u < .7 ? 1 : (1 - u)/.3; });
}
function spawnSpark(from){
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:softGlow(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, toneMapped:false }));
  const v = new THREE.Vector3((Math.random()-.5)*.5, .5 + Math.random()*.9, (Math.random()-.5)*.5), sz = .05 + Math.random()*.1, life = 2.5 + Math.random()*2;
  sp.position.copy(from); sp.renderOrder = 6;
  const base = from.clone();
  addFx(sp, nat, life, (u, o) => { o.position.set(base.x + v.x*u*life, base.y + v.y*u*life - .25*u*u*life*life*.3, base.z + v.z*u*life); const k = sz*(1 - u*.5); o.scale.set(k, k, 1); o.material.opacity = Math.sin(Math.PI*Math.min(1, u*1.1)); });
}
function updateFxList(t){
  for (let i = fxList.length - 1; i >= 0; i--){
    const f = fxList[i]; if (f.t0 < 0) f.t0 = t;
    const u = (t - f.t0)/f.dur;
    if (u >= 1){ f.parent.remove(f.obj); if (f.obj.material) f.obj.material.dispose(); fxList.splice(i, 1); continue; }
    f.upd(u, f.obj);
  }
}

/* ---------- Il momento speciale alla mangiatoia ---------- */
const magic = { until:0, cool:0, nearT:0, spawnAcc:0, angels:[], env:0 };
const mangerLocal = () => nat.position;
function triggerMagic(fromMe){
  const t = guide.now;
  if (!nat || t < magic.cool) return;
  magic.until = t + 16; magic.cool = t + 70; magic.spawnAcc = 0;
  if (!angelTex) angelTex = angelTexture();
  magic.angels.forEach(a => nat.remove(a)); magic.angels = [];
  for (let i=0;i<5;i++){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:angelTex, transparent:true, depthWrite:false, toneMapped:false, opacity:0 }));
    sp.renderOrder = 6; sp.userData = { a:i*Math.PI*2/5, r:1.0 + (i%2)*.35, h:1.85 + (i%3)*.18 }; magic.angels.push(sp); nat.add(sp);
  }
  if (!bigGlow){
    bigGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:softGlow(), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, toneMapped:false, opacity:0 }));
    bigGlow.position.set(0, .6, -.1); bigGlow.scale.set(3.2, 3.2, 1); bigGlow.renderOrder = 1; nat.add(bigGlow);
  }
  const w = root.localToWorld(new THREE.Vector3(nat.position.x, 1.2, nat.position.z));
  sfxBells(w, SFX_GLORIA, .26, .34);
  say(tr("magic"), 9);
  if (fromMe && net) net.event("magic");
}
function updateMagic(dt, t){
  const u = magic.until - t, e = magic.until > 0 ? Math.max(0, Math.min(1, (16 - u)/2.2, u/2.6)) : 0;
  magic.env = e; starBoost = e;
  if (bigGlow) bigGlow.material.opacity = .5*e;
  magic.angels.forEach(sp => {
    const d = sp.userData, a = d.a + t*.32;
    sp.position.set(Math.cos(a)*d.r, d.h + Math.sin(t*1.7 + d.a)*.06, -.1 + Math.sin(a)*d.r*.8);
    const k = .6*Math.max(.001, e); sp.scale.set(k, k, 1); sp.material.opacity = e;
  });
  if (e > 0 && u > 12){ magic.spawnAcc += dt*28; while (magic.spawnAcc > 1){ magic.spawnAcc--; spawnSpark(new THREE.Vector3((Math.random()-.5)*.4, .3, -.1 + (Math.random()-.5)*.4)); } }
  if (u <= 0 && magic.until > 0){ magic.until = 0; magic.angels.forEach(a => nat.remove(a)); magic.angels = []; }
  // vicino alla mangiatoia (e, se c’è un amico, tutti e due) per un paio di secondi: scatta da solo
  if (t > magic.cool && magic.until === 0){
    const m = mangerLocal(); tmp.copy(head); root.worldToLocal(tmp);
    let near = Math.hypot(tmp.x - m.x, tmp.z - m.z) < 1.9;
    peers.forEach(p => { if (p.av.visible && Math.hypot(p.tx - m.x, p.tz - m.z) > 1.9) near = false; });
    magic.nearT = near ? magic.nearT + dt : Math.max(0, magic.nearT - dt*2);
    if (magic.nearT > 2.5){ magic.nearT = 0; triggerMagic(true); }
  }
}

/* ---------- Interazioni: tocca la mucca, la stella, la mangiatoia, oppure manda un cuore ---------- */
const hitMeshes = [], rayc = new THREE.Raycaster();
let cowObj = null;
function setupHits(model){
  const mk = (kind, r) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), new THREE.MeshBasicMaterial({ visible:false })); m.userData.kind = kind; hitMeshes.push(m); return m; };
  root.updateMatrixWorld(true);
  const cow = mk("cow", .55);
  let c = new THREE.Vector3(CFG.cowX*CFG.modelScale + model.position.x, .55, CFG.cowZ*CFG.modelScale + model.position.z);
  if (cowObj){ const bx = new THREE.Box3().setFromObject(cowObj); if (!bx.isEmpty()){ bx.getCenter(c); nat.worldToLocal(c); } }
  cow.position.copy(c); nat.add(cow);
  const manger = mk("manger", .45); manger.position.set(0, .25, -.1); nat.add(manger);
  if (starObj){ const st = mk("star", .4); starObj.add(st); }
}
const myColor = { i:Math.floor(Math.random()*6) };
function eventAt(kind){                                      // suona e mostra l’effetto di cow / star / manger
  if (!nat) return; nat.updateWorldMatrix(true, false);
  const h = hitMeshes.find(m => m.userData.kind === kind); if (!h) return;
  const w = h.getWorldPosition(new THREE.Vector3());
  if (kind === "cow") sfxMoo(w);
  else if (kind === "star"){ sfxBells(w, SFX_STAR, .16, .3); starBoost = Math.max(starBoost, .6); setTimeout(() => { if (!magic.until) starBoost = 0; }, 900); }
  else sfxBells(w, SFX_LULLABY, .3, .22);
  const l = w.clone(); root.worldToLocal(l); l.y += kind === "star" ? .3 : .35; spawnHeart(l);
}
function interact(origin, dir){
  if (!root.visible) return;
  rayc.set(origin, dir); rayc.far = 8;
  if (finale.mesh && finale.mesh.visible && rayc.intersectObject(finale.mesh).length){ hideFinale(); return; }
  const hit = rayc.intersectObjects(hitMeshes, false)[0];
  if (hit){ const k = hit.object.userData.kind; eventAt(k); if (net) net.event(k); return; }
  const p = origin.clone().addScaledVector(dir, .4); root.worldToLocal(p); spawnHeart(p);   // niente da toccare: un cuore per l’amico
  if (net) net.event("heart");
}
const _o = new THREE.Vector3(), _d = new THREE.Vector3();
function ctlInteract(ctl){
  ctl.getWorldPosition(_o); _d.set(0, 0, -1).transformDirection(ctl.matrixWorld); interact(_o, _d);
}

/* ---------- Il narratore ---------- */
const NARR = { on:false, cur:-1, away:0, voice:null, done:[] };
function pickVoice(){
  try { const pre = LANG === "en" ? "en" : "it"; NARR.voice = speechSynthesis.getVoices().find(v => v.lang.toLowerCase().startsWith(pre)) || null; } catch (_) {}
}
function duck(on){ duckK = on ? .35 : 1; setVol(vol); }
function stopNarr(){ try { speechSynthesis.cancel(); } catch (_) {} NARR.cur = -1; duck(false); }
function narrate(i){
  stopNarr();
  try {
    const st = stText(STATIONS[i]), u = new SpeechSynthesisUtterance(`${st.title}. ${st.body.join(" ")} ${st.quote}`);
    u.lang = LANG === "en" ? "en-US" : "it-IT"; if (NARR.voice) u.voice = NARR.voice; u.rate = .95;
    u.onend = u.onerror = () => { if (NARR.cur === i){ NARR.cur = -1; NARR.done[i] = true; duck(false); } };
    NARR.cur = i; NARR.done[i] = false; duck(true); speechSynthesis.speak(u);
  } catch (_) { NARR.cur = -1; duck(false); }
}
function updateNarr(dt){
  if (!NARR.on) return;
  let g = -1;
  stations.forEach((s, i) => { if (s.dwell > 1.6 && s.h > .5) g = i; if (s.h < .15) NARR.done[i] = false; });
  if (g >= 0 && NARR.cur !== g && !NARR.done[g]) narrate(g);
  if (NARR.cur >= 0){ NARR.away = stations[NARR.cur].h < .15 ? NARR.away + dt : 0; if (NARR.away > 2){ NARR.away = 0; stopNarr(); } }
}

function showFinale(){

  const m = finale.mesh; if (!m || !m.visible) return;

  m.lookAt(head.x, m.position.y, head.z);

  lightStars(0); magic.until = 0; magic.cool = 0; magic.nearT = 0; starBoost = 0; magic.angels.forEach(a => nat.remove(a)); magic.angels = [];
  if (bigGlow) bigGlow.material.opacity = 0;

/* ---------- Multiplayer: vedi l’altro visitatore (cappello colorato e mani) ---------- */
const HAT_COLORS = [0xc4161c, 0x147a3e, 0x1f56b8, 0x7b2fa0, 0xd0540a, 0x0b8497];
const peers = new Map();            // peerId -> { av, hat, hl, hr, capMat, handMat, tx.., seen, init, color }
let net = null, netSendAt = 0, waitSaid = false, tipSaid = false, netStartAt = 0;
function makeAvatar(colorIdx){
  const av = new THREE.Group(), hat = new THREE.Group();
  const capMat = new THREE.MeshStandardMaterial({ color:HAT_COLORS[colorIdx], roughness:.85 });
  const white = new THREE.MeshStandardMaterial({ color:0xfafafa, roughness:.95 });
  const cone = new THREE.Mesh(new THREE.ConeGeometry(.115, .3, 20), capMat); cone.position.set(0, .16, 0);
  const brim = new THREE.Mesh(new THREE.TorusGeometry(.118, .034, 12, 28), white); brim.rotation.x = Math.PI/2;
  const tip = new THREE.Mesh(new THREE.SphereGeometry(.05, 14, 12), white); tip.position.set(0, .33, 0);
  const top = new THREE.Group(); top.add(cone, tip); top.rotation.x = -.35; top.position.set(0, 0, -.01);
  hat.add(top, brim);
  const handMat = new THREE.MeshStandardMaterial({ color:HAT_COLORS[colorIdx], roughness:.5, emissive:HAT_COLORS[colorIdx], emissiveIntensity:.25 });
  const mkHand = () => { const h = new THREE.Mesh(new THREE.SphereGeometry(.035, 14, 10), handMat); h.visible = false; return h; };
  const hl = mkHand(), hr = mkHand();
  av.add(hat, hl, hr); av.visible = false;
  return { av, hat, hl, hr, capMat, handMat };
}
function setPeerColor(p, i){ p.color = i; p.capMat.color.setHex(HAT_COLORS[i]); p.handMat.color.setHex(HAT_COLORS[i]); p.handMat.emissive.setHex(HAT_COLORS[i]); }
function peerFor(id){
  let p = peers.get(id);
  if (!p){
    p = { ...makeAvatar(0), tx:0, ty:0, tz:0, tyaw:0, tpitch:0, seen:-1e9, init:false, color:0, lh:null, rh:null }; root.add(p.av); peers.set(id, p);
  }
  return p;
}
function onPeerState(id, d){
  const p = peerFor(id);
  [p.tx, p.ty, p.tz, p.tyaw, p.tpitch] = d; p.seen = performance.now();
  if (d[5] !== p.color && d[5] >= 0 && d[5] < HAT_COLORS.length) setPeerColor(p, d[5]);
  if (d[5] === myColor.i && selfId > id) myColor.i = (myColor.i + 1 + Math.floor(Math.random()*5)) % HAT_COLORS.length;   // due cappelli uguali: uno dei due cambia colore
  p.lh = d[6] === null ? null : [d[6], d[7], d[8]]; p.rh = d[9] === null ? null : [d[9], d[10], d[11]];
  if (!p.init){ p.init = true; p.hat.position.set(d[0], d[1], d[2]); p.hat.rotation.set(0, d[3], 0); }
}
function onPeerEvent(id, k){
  const p = peers.get(id);
  if (k === "magic") triggerMagic(false);
  else if (k === "heart"){ if (p && p.av.visible) spawnHeart(new THREE.Vector3(p.hat.position.x, p.hat.position.y + .55, p.hat.position.z)); }
  else if (k === "cow" || k === "star" || k === "manger") eventAt(k);
}
function startNet(){
  if (net) return;
  const code = ((document.querySelector("#roomCode")?.value || "presepe").trim().toLowerCase().replace(/[^a-z0-9_-]/g, "")) || "presepe";
  netStartAt = performance.now(); net = null; netRoom = code;
  try {
    net = connectNet("natività-" + code, {
      onPeerState, onEvent: onPeerEvent,
      onPeerJoin: id => { peerFor(id); netSendAt = 0; say(tr("joined"), 7); },        // appena entra qualcuno, rimando subito la mia posizione
      onPeerLeave: id => { const p = peers.get(id); if (p){ root.remove(p.av); peers.delete(id); say(tr("left"), 6); } }
    });
  } catch (e) { console.warn("Multiplayer non disponibile:", e); net = null; }
}
let netRoom = "presepe";
function stopNet(){
  if (net){ net.leave(); net = null; }
  peers.forEach(p => root.remove(p.av)); peers.clear();
}
const _h = new THREE.Vector3();
function ctlLocal(i){
  const c = renderer.xr.getController(i);
  if (desktop || !c.userData.src) return [null, null, null];
  c.getWorldPosition(_h); root.worldToLocal(_h); return [+_h.x.toFixed(3), +_h.y.toFixed(3), +_h.z.toFixed(3)];
}
// chiamata a ogni frame, dopo che la natività è stata messa a terra
function updateNet(dt, t){
  const now = performance.now();
  if (net && now - netSendAt > 66){                               // ~15 aggiornamenti al secondo
    netSendAt = now;
    tmp.copy(head); root.worldToLocal(tmp);
    const yaw = Math.atan2(-look.x, -look.z) - root.rotation.y, pitch = Math.asin(THREE.MathUtils.clamp(look.y, -1, 1));
    net.send([+tmp.x.toFixed(3), +tmp.y.toFixed(3), +tmp.z.toFixed(3), +yaw.toFixed(3), +pitch.toFixed(3), myColor.i, ...ctlLocal(0), ...ctlLocal(1)]);
  }
  if (net && !waitSaid && peers.size === 0 && now - netStartAt > 16000){ waitSaid = true; say(tr("waiting")(netRoom), 9); }   // nessuno è ancora arrivato
  const k = 1 - Math.exp(-dt*12);
  peers.forEach(p => {
    p.av.visible = p.init && now - p.seen < 4000;                // se non arrivano dati per 4 s, sparisce
    if (!p.av.visible) return;
    const hp = p.hat.position;
    hp.x += (p.tx - hp.x)*k; hp.y += (p.ty - hp.y)*k; hp.z += (p.tz - hp.z)*k;
    p.hat.rotation.y += Math.atan2(Math.sin(p.tyaw - p.hat.rotation.y), Math.cos(p.tyaw - p.hat.rotation.y))*k;
    p.hat.rotation.x += (-p.tpitch*.6 - p.hat.rotation.x)*k;
    for (const [h, tg] of [[p.hl, p.lh], [p.hr, p.rh]]){
      h.visible = !!tg; if (!tg) continue;
      if (!h.userData.init){ h.position.set(tg[0], tg[1], tg[2]); h.userData.init = true; }
      h.position.x += (tg[0] - h.position.x)*k; h.position.y += (tg[1] - h.position.y)*k; h.position.z += (tg[2] - h.position.z)*k;
    }
  });
}
function updateWorld(dt, t){
  updateMagic(dt, t); updateNarr(dt); updateGuideStars(dt); updateFinale(dt, t); updateFxList(t); updateListener();
  if (!tipSaid && guide.introDone && t > guide.msgUntil + 3 && stations.some(s => s.dwell > .2)){ tipSaid = true; say(tr("tip"), 8); }   // un solo consiglio, quando hai finito di leggere la presentazione
}

/* ---------- Anteprima da computer: cammini con WASD e guardi trascinando il mouse ---------- */
const EYE = 1.6;
function setupDesktopControls(){
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e => { if (!desktop) return; D.dx = e.clientX; D.dy = e.clientY; D.drag = true; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); if (!musicOn) playSong(); });
  addEventListener("pointerup", e => {
    const was = D.drag; D.drag = false; cv.classList.remove("drag");
    if (desktop && was && Math.hypot(e.clientX - D.dx, e.clientY - D.dy) < 5){ camera.getWorldDirection(_d); interact(camera.position, _d); }   // clic senza trascinare = tocca
  });
  addEventListener("pointermove", e => {
    if (!D.drag || !desktop) return;
    D.yaw -= e.movementX*.004; D.pitch = Math.max(-1.2, Math.min(1.2, D.pitch - e.movementY*.004));
  });
  cv.addEventListener("wheel", e => { if (desktop){ D.walk -= e.deltaY*.0025; e.preventDefault(); } }, { passive:false });
  addEventListener("keydown", e => {
    const k = e.key.toLowerCase(); D.keys[k] = true;
    if (!desktop) return;
    if (k === "r") resetVisit();
    if (k === "m"){ if (musicOn) fadeSong(0); else playSong(); }
    if (k.startsWith("arrow") || k === " ") e.preventDefault();
  });
  addEventListener("keyup", e => { D.keys[e.key.toLowerCase()] = false; });
  addEventListener("blur", () => { D.keys = {}; });
}
function moveCamera(dt){
  const K = D.keys, sp = (K.shift ? 2.6 : 1.3)*dt;
  const f = (K.w||K.arrowup ? 1 : 0) - (K.s||K.arrowdown ? 1 : 0) + D.walk, r = (K.d ? 1 : 0) - (K.a ? 1 : 0);
  D.walk = 0;
  if (K.arrowleft) D.yaw += 1.6*dt;
  if (K.arrowright) D.yaw -= 1.6*dt;
  const sy = Math.sin(D.yaw), cy = Math.cos(D.yaw);
  D.x += (-sy*f + cy*r)*sp; D.z += (-cy*f - sy*r)*sp;
  camera.position.set(D.x, EYE, D.z);
  camera.rotation.set(D.pitch, D.yaw, 0, "YXZ");
}
function resetVisit(){
  last = null; startTime = 0; S.placed = false; root.visible = false; gripCount = 0; gripHold = 0;
  guide.introDone = false; guide.ready = false; guide.msgUntil = 0;
  stations.forEach(st => { st.visited = false; st.dwell = 0; }); resetExtras();
  D.x = 0; D.z = 0; D.yaw = 0; D.pitch = -0.05;
}
function startDesktop(){
  playSong(); ensureAudio(); startAmbience();   // parte col clic sul bottone
  desktop = true; resetVisit();
  document.body.classList.add("pc");
  startNet();
  renderer.setClearColor(0x0d1630, 1); scene.fog = new THREE.Fog(0x0d1630, 8, 22); floorMesh.visible = true;
  ui.classList.add("hidden"); document.querySelector("#hud").classList.remove("hidden"); document.querySelector("#dot").classList.remove("hidden");
}

/* ---------- Sessione AR ---------- */
function restartVisit(){
  last = null; startTime = 0; S.placed = false; root.visible = false; gripCount = 0; gripHold = 0;
  guide.introDone = false; guide.ready = false; guide.msgUntil = 0; guide.nextAt = 0; guide.endAt = 0; guide.turn = 0;
  stations.forEach(st => { st.visited = false; st.dwell = 0; }); resetExtras();
}
async function startAR(){
  playSong(); ensureAudio(); startAmbience();   // parte col tocco sul bottone: i browser non permettono l’audio prima di un gesto
  try {
    session = await navigator.xr.requestSession("immersive-ar", {
      optionalFeatures: ["local-floor","bounded-floor","hand-tracking","light-estimation"]
    });
  } catch (e) { fadeSong(0); setStatus("Impossibile avviare la sessione AR: " + e.message); return; }
  desktop = false; document.body.classList.remove("pc"); renderer.setClearColor(0x000000, 0); scene.fog = null; floorMesh.visible = false;
  await renderer.xr.setSession(session);
  ui.classList.add("hidden");
  startNet();
  restartVisit();
  renderer.xr.getReferenceSpace()?.addEventListener?.("reset", () => { S.placed = false; startTime = 0; });   // se il visore ricentra la stanza
  let hiddenAt = 0;                                                                                          // visore tolto per più di 45 s: la visita riparte da capo per il prossimo
  session.addEventListener("visibilitychange", () => {
    if (session && session.visibilityState === "hidden"){ hiddenAt = performance.now(); stopNarr(); }
    else if (hiddenAt && performance.now() - hiddenAt > 45000) restartVisit();
    if (session && session.visibilityState !== "hidden") hiddenAt = 0;
  });
  session.addEventListener("end", () => {
    session = null; stopNet(); stopNarr(); stopAmbience(); fadeSong(0); ui.classList.remove("hidden");
    setStatus(tr("ended")); showEndInfo();
    startBtn.textContent = tr("reenter");
  }, { once:true });
}

/* ---------- Aggiornamento per frame ---------- */
function update(dt, t){
  if (cowMixer) cowMixer.update(dt);
  const cam = desktop ? camera : renderer.xr.getCamera();
  head.setFromMatrixPosition(cam.matrixWorld);
  cam.getWorldDirection(look);
  fwd.set(look.x, 0, look.z);
  if (fwd.lengthSq() < 1e-4) fwd.set(0,0,-1);
  fwd.normalize();

  // la scena compare solo quando il visore ha una posizione valida e guardi più o meno avanti (non su/giù)
  if (!S.placed && ((head.x === 0 && head.y === 0 && head.z === 0) || Math.abs(look.y) > .85)){ startTime = 0; return; }
  if (!startTime) startTime = t;
  if (!S.placed){
    if (t - startTime < CFG.spawnDelay) return;
    place();
  }
  gripHold = gripCount >= 2 ? gripHold + dt : 0;       // due grip tenuti 1 secondo: rimette la natività davanti a te
  if (gripHold > 1){ place(); gripHold = -999; }
  if (S.placedAt < 0) S.placedAt = t;
  const kp = 1 - Math.exp(-dt*4);               // spostamento dolce della natività
  root.position.x += (S.tx - root.position.x)*kp; root.position.y += (S.ty - root.position.y)*kp; root.position.z += (S.tz - root.position.z)*kp;
  root.rotation.y += Math.atan2(Math.sin(S.tyaw - root.rotation.y), Math.cos(S.tyaw - root.rotation.y))*kp;
  const since = t - S.placedAt, cosGaze = Math.cos(THREE.MathUtils.degToRad(CFG.gazeDeg));

  // la natività compare per prima, poi i poster uno dopo l’altro
  nat.scale.setScalar(Math.max(0.001, easeOutBack(clamp01(since/1.0))));
  if (snow){ const u = snow.material.uniforms; u.uTime.value = t; u.uHead.value.copy(head); u.uFade.value = clamp01(since/3); }
  if (starObj) updateStar(t);

  stations.forEach((s, i) => {
    const a = since - .5 - i*0.3;
    const e2 = Math.max(0.001, easeOutBack(clamp01(a/0.8)));

    // poster: leggero galleggiamento + alone quando lo guardi
    s.poster.getWorldPosition(tmp).sub(head); const dist = tmp.length(); tmp.normalize();
    const looking = tmp.dot(look) > cosGaze, target = looking ? 1 : 0;
    s.dwell = Math.max(0, s.dwell + ((looking && dist < CFG.near && a > 1) ? dt : -dt*.5));   // lo stai leggendo?
    if (s.dwell > 1.6 && !s.visited){ s.visited = true; onVisit(i); }
    s.h += (target - s.h) * (1 - Math.exp(-dt*6));
    s.poster.scale.setScalar(e2 * (1 + .03*s.h));
    s.poster.position.y = CFG.posterY + Math.sin(t*.9 + i)*.015;
    s.halo.material.opacity = .2 + .8*s.h;
  });
  updateGuide(dt, t, since);
  updateNet(dt, t);
  updateWorld(dt, t);
}

function render(time){
  const t = time/1000;
  if (last === null) last = t;
  const dt = Math.min(t - last, 0.05); last = t;
  if (desktop && nat){
    moveCamera(dt); camera.updateMatrixWorld(true); update(dt, t);
    fpsT += dt; if (++fpsN === 60){                  // risoluzione adattiva sul computer: se va a scatti scende, se è fluida risale
      const avg = fpsT/fpsN; fpsT = fpsN = 0;
      if (avg > .026 && PR > .6){ PR = Math.max(.6, PR - .15); renderer.setPixelRatio(PR); }
      else if (avg < .017 && PR < PR_MAX){ PR = Math.min(PR_MAX, PR + .1); renderer.setPixelRatio(PR); }
    }
  }
  else if (renderer.xr.isPresenting && nat) update(dt, t);
  renderer.render(scene, camera);
}

/* ---------- Avvio ---------- */
const barEl = document.querySelector("#bar"), barFill = document.querySelector("#bar i");
const setBar = f => { barFill.style.width = Math.round(Math.min(1, f)*100) + "%"; };
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelector("#t_title").textContent = tr("title"); document.querySelector("#t_intro").textContent = tr("intro");
  document.querySelector("#t_narr").textContent = tr("narr"); document.querySelector("#t_room").textContent = tr("room"); document.querySelector("#t_roomHint").textContent = tr("roomHint");
  document.querySelector("#hud").innerHTML = tr("hud"); document.title = tr("title");
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.lang === LANG));
  pcBtn.textContent = tr("btnPc");
  if (modelOK && xrChecked) refreshButton(); else { startBtn.textContent = tr("btnLoad"); }
  posterRecs.forEach(r => { drawPoster(stText(r.st), r.i, r.n, r.art, r.lg, r.pcv); r.tex.needsUpdate = true; });   // i poster nella lingua scelta
  if (finale.shown && finale.cv){ drawFinale(finale.cv); finale.tex.needsUpdate = true; }
  pickVoice();
}
document.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => { LANG = b.dataset.lang; try { localStorage.setItem("nat-lang", LANG); } catch (_) {} applyLang(); }));
const hasVoice = "speechSynthesis" in window;
const narrBox = document.querySelector("#narr");
if (!hasVoice) document.querySelector("#narrWrap").classList.add("hidden");
else {
  try { narrBox.checked = localStorage.getItem("nat-narr") !== "0"; } catch (_) { narrBox.checked = true; }
  NARR.on = narrBox.checked; speechSynthesis.onvoiceschanged = pickVoice;
  narrBox.addEventListener("change", () => { NARR.on = narrBox.checked; if (!NARR.on) stopNarr(); try { localStorage.setItem("nat-narr", NARR.on ? "1" : "0"); } catch (_) {} });
}
let endQr = null;
async function showEndInfo(){
  const el = document.querySelector("#endInfo"); if (!CFG.infoUrl){ el.classList.add("hidden"); return; }
  try {
    if (!endQr){ const { qrcode } = await import("./vendor/qr.js"); const q = qrcode(0, "M"); q.addData(CFG.infoUrl); q.make(); endQr = q.createDataURL(6, 2); }
    el.innerHTML = `${tr("endInfo")}<br><img alt="QR" src="${endQr}"><a href="${CFG.infoUrl}" target="_blank" rel="noopener">${CFG.infoUrl.replace(/^https?:\/\//, "")}</a>`;
    el.classList.remove("hidden");
  } catch (e) { console.warn("QR non creato:", e); }
}
function refreshButton(){
  if (!modelOK || !xrChecked) return;
  startBtn.disabled = false; barEl.classList.add("done");
  if (xrOK){                                    // sul visore: realtà mista, e in più l’anteprima da computer
    startBtn.textContent = tr("btnAR"); pcBtn.classList.remove("hidden");
    setStatus(tr("readyXR"));
  } else {                                      // sul computer: solo l’anteprima
    startBtn.textContent = tr("btnPreview");
    setStatus(tr("readyPC"));
  }
}
async function checkXR(){
  xrOK = !!navigator.xr && await navigator.xr.isSessionSupported("immersive-ar").catch(() => false);
  xrChecked = true; refreshButton();
}
startBtn.addEventListener("click", () => xrOK ? startAR() : startDesktop());
pcBtn.addEventListener("click", startDesktop);
init();
applyLang();
if (new URLSearchParams(location.search).has("debug")) window.__nat = { fxList, triggerMagic, eventAt, showFinale, lightStars, interact, peers, setLang:l => { LANG = l; applyLang(); } };   // solo per le prove: aggiungi ?debug all’indirizzo
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});   // per aprire il sito anche senza internet
loadNativity().then(m => { nat.add(m); try { setupHits(m); } catch (e) { console.warn(e); } modelOK = true; setBar(1); refreshButton(); setupSong(); })   // la canzone si scarica dopo il modello, non insieme
  .catch(e => { console.error(e); setStatus("Non riesco a caricare la natività: " + (e && e.message || e)); setupSong(); });
checkXR();
</script>
